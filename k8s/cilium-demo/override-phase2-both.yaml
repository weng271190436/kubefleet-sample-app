# Phase 2: App runs on BOTH clusters (bridge phase)
# member-01 (eastus): replicas=1, member-02 (westus): replicas=1
---
apiVersion: placement.kubernetes-fleet.io/v1beta1
kind: ResourceOverride
metadata:
  name: backend-override
  namespace: kubefleet-sample
spec:
  resourceSelectors:
    - group: apps
      kind: Deployment
      version: v1
      name: sample-backend
  policy:
    overrideRules:
      - clusterSelector:
          clusterSelectorTerms:
            - labelSelector:
                matchLabels:
                  region: eastus
        jsonPatchOverrides:
          - op: replace
            path: /spec/template/spec/containers/0/env/0/value
            value: "member-01 (eastus)"
      - clusterSelector:
          clusterSelectorTerms:
            - labelSelector:
                matchLabels:
                  region: westus
        jsonPatchOverrides:
          - op: replace
            path: /spec/template/spec/containers/0/env/0/value
            value: "member-02 (westus)"

