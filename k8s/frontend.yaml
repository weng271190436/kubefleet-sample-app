apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-frontend
  labels:
    app: sample-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-frontend
  template:
    metadata:
      labels:
        app: sample-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/weng271190436/kubefleet-sample-app/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sample-frontend
  annotations:
    io.cilium/global-service: "true"
    io.cilium/shared-service: "true"
spec:
  type: NodePort
  selector:
    app: sample-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
