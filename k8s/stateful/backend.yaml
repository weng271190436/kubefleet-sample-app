apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-backend
  namespace: kubefleet-pg
  labels:
    app: sample-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-backend
  template:
    metadata:
      labels:
        app: sample-backend
    spec:
      containers:
        - name: backend
          image: kubefleet-sample-backend-pg:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CLUSTER_NAME
              value: "unknown"
            - name: DB_HOST
              value: "postgres-0.postgres.kubefleet-pg.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "appdb"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: READ_ONLY
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sample-backend
  namespace: kubefleet-pg
spec:
  selector:
    app: sample-backend
  ports:
    - port: 8000
      targetPort: 8000
